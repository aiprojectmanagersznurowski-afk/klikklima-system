name: Bramka kontraktowa KlikKlima

# Przeniesione z turborepo/.github/workflows/kk-gate.yml (2026-09-09) — GitHub Actions
# czyta wyłącznie .github/workflows/ w KORZENIU repozytorium. Plik leżący jeden poziom
# niżej nigdy się nie uruchamiał; kontrakt, kk-selftest i pełny pakiet testów jednostkowych
# istniały tylko jako hook przed commitem na maszynie deweloperskiej, nie jako bramka
# serwerowa. Przy tej samej okazji: pnpm → npm (repo stoi na npm, nie na pnpm — oryginalny
# plik nigdy nie mógłby przejść kroku instalacji), i usunięty serwis Postgres z joba
# `aplikacja` — pakiet testów mockuje Prismę w każdym pliku (zero testów łączy się z żywą
# bazą), a `packages/database/prisma` nie ma katalogu migracji (schemat trzymany w
# `supabase/migrations/`, aplikowany ręcznie na środowisko), więc `prisma migrate deploy`
# nie miałby czego wdrożyć. Prawdziwy Postgres (i realnie: lokalny stack Supabase CLI,
# bo migracje używają auth.email() i ról anon/authenticated) jest osobnym zadaniem —
# potrzebnym dla testów RLS i atomowości rezerwacji, nieistniejących jeszcze w tym repo.
#
# UZUPEŁNIONE 2026-09-10 (D-2, docs/workorders/FLD-BOOKING-ATOMIC-ASSIGN.md): powyższy opis
# "osobne zadanie" jest teraz job `integracja` niżej. Konwencja *.itest.ts / *.test.ts
# (vitest.integration.config.mts vs vitest.config.mts) rozdziela testy potrzebujące żywego
# Postgresa od tych na atrapie Prismy — atrapa nie dowodzi niczego o zachowaniu
# `EXCLUDE USING gist` pod dwoma równoległymi żądaniami, bo dowodzi wyłącznie tego, jak
# sama została zaprogramowana.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./turborepo

jobs:
  # Etap 1 — kontrakt. Uruchamiany osobno i jako pierwszy, bo jeśli źródło prawdy
  # jest sprzeczne, wyniki testów aplikacji nic nie znaczą. Ten job nie ma zależności
  # i kończy się w kilka sekund, więc daje najszybszą informację zwrotną.
  kontrakt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Spójność kontraktu
        run: node tools/kk-validate.mjs
      - name: Żywotność bramki (test mutacyjny)
        run: node tools/kk-selftest.mjs
      - name: Dryf codegenu
        run: node tools/kk-codegen.mjs --check
      - name: Identyfikowalność wymagań
        run: node tools/kk-trace.mjs --enforce

  # Etap 2 — aplikacja. Uruchamiany dopiero po zielonym kontrakcie.
  aplikacja:
    needs: kontrakt
    runs-on: ubuntu-latest
    env:
      # Wystarcza do `prisma generate` (postinstall) — pakiet testów mockuje Prismę,
      # żaden test nie otwiera prawdziwego połączenia.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/klikklima_ci_placeholder
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/klikklima_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: turborepo/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=json --outputFile=test-results.json
      - name: Macierz identyfikowalności z wynikami testów
        run: node tools/kk-trace.mjs --results test-results.json --enforce
      - name: Tabela pokrycia do podsumowania PR
        if: always()
        run: node tools/kk-trace.mjs --markdown >> $GITHUB_STEP_SUMMARY

  # Etap 2b — testy integracyjne na żywym Postgresie (D-2, FLD-BOOKING-ATOMIC-ASSIGN).
  # Równoległy do `aplikacja` (obie tylko `needs: kontrakt`) — różne konfiguracje vitest,
  # różne pliki (*.itest.ts vs *.test.ts), zero współdzielonego stanu między nimi.
  # `supabase start` reużywa to samo, już działające w tym repo podejście co job
  # `build-and-test` w głównym ci.yml (Postgres + PostgREST + Auth, nie goły kontener —
  # migracje używają auth.email() i ról anon/authenticated), więc migracje z
  # `supabase/migrations/` aplikują się automatycznie przy starcie stacku.
  integracja:
    needs: kontrakt
    runs-on: ubuntu-latest
    env:
      # Ten sam powód co w jobie `aplikacja`: `npm ci` odpala `postinstall` -> `prisma
      # generate` PRZED `supabase start`, a `prisma.config.ts` wymaga DATABASE_URL nawet
      # do samego `generate` (który realnego połączenia i tak nie otwiera). Placeholder
      # jest nadpisywany prawdziwym URL-em lokalnego stacku w kroku "Eksport zmiennych
      # środowiskowych" niżej — brak tego bloku psuje `npm ci` na starcie, zanim Supabase
      # CLI zostanie nawet zainstalowane (wykryte 2026-09-11 na żywym uruchomieniu CI:
      # "Missing required environment variable: DATABASE_URL", potem "supabase: command
      # not found" w kroku sprzątania, bo job padł zanim CLI zdążyło się zainstalować).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/klikklima_ci_placeholder
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/klikklima_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: turborepo/package-lock.json }
      - run: npm ci
      - name: Instalacja Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start lokalnego stacku Supabase (migracje aplikują się automatycznie)
        run: supabase start
      - name: Eksport zmiennych środowiskowych lokalnego stacku
        run: |
          supabase status -o json > /tmp/supabase-status.json
          {
            echo "DATABASE_URL=$(node -pe 'require("/tmp/supabase-status.json").DB_URL')"
            echo "DIRECT_URL=$(node -pe 'require("/tmp/supabase-status.json").DB_URL')"
          } >> "$GITHUB_ENV"
      - name: Testy integracyjne (*.itest.ts, żywy Postgres)
        run: npm run test:integration
      - name: Zatrzymanie lokalnego stacku Supabase
        if: always()
        run: supabase stop

  # Etap 3 — recenzja agentowa w trybie headless. Nieblokująca:
  # komentarz recenzenta ma pomagać człowiekowi, a nie zastępować jego decyzji.
  recenzja-agentowa:
    needs: kontrakt
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Recenzja przez subagenta reviewer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Wymaga zainstalowanego Claude Code w runnerze i skonfigurowanego sekretu
          # ANTHROPIC_API_KEY. Brak sekretu = krok kończy się cicho, joba to nie blokuje.
          npx --yes @anthropic-ai/claude-code -p \
            "Użyj subagenta reviewer do recenzji diffu wobec origin/main. Zwróć wyłącznie werdykt w ustalonym formacie." \
            > review.md || echo "Recenzja niedostępna" > review.md
          cat review.md >> $GITHUB_STEP_SUMMARY
