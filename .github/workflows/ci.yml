name: CI / CD Workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./turborepo
    env:
      # Wystarcza do `prisma generate` (postinstall) — nie łączy się z żywą bazą.
      # Realne połączenie (migracje/testy integracyjne) to osobny krok, jeszcze nieistniejący.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/klikklima_ci_placeholder
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/klikklima_ci_placeholder
      # Od B2C-RLS-PUBLIC AC5 (PR #31) apps/b2c-web/lib/supabaseClient.ts rzuca fail-closed
      # przy imporcie, jeśli tych dwóch brakuje. Krok "Budowanie projektu" biegnie DZIŚ
      # PO starcie Supabase (przeniesiony 2026-09-30 — patrz komentarz przy tym kroku),
      # więc te wartości są tu wyłącznie fallbackiem dla wcześniejszych kroków (np. lint),
      # zanim `GITHUB_ENV` nadpisze je prawdziwymi z lokalnego stacku. Wartości nie są
      # sekretem (NEXT_PUBLIC_* i tak trafiają do przeglądarki).
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-not-a-real-key

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja pakietów
        run: npm install

      - name: Linter (Turborepo)
        run: npm run lint

      # Krok 3a planu Field App (2026-09-10): realny Postgres + PostgREST + Auth,
      # nie goły kontener bazy — migracje w supabase/migrations/ używają auth.email()
      # i ról anon/authenticated, których zwykły `postgres:16` nie ma. `supabase start`
      # aplikuje wszystkie migracje automatycznie przy starcie.
      #
      # ZAMKNIĘTE (2026-09-10, migracja 20260910090000_b2c_catalog_view_tracked.sql):
      # widok zmaterializowany `available_combinations` jest teraz śledzoną migracją —
      # ten komentarz opisywał stan SPRZED tamtej migracji, zostawiony wcześniej
      # nieaktualny. Katalog/dane produktów pochodzą z fuji_seed.sql (podpięty pod
      # supabase/config.toml `db.seed.sql_paths`, patrz commit fix(e2e) #35).
      #
      # ZNANA LUKA (decyzja biznesowa, nie techniczna): booking-validation.spec.ts
      # klika w prawdziwy kalendarz, czyli woła Google Calendar przez konto serwisowe.
      # Bez sekretów Google w tym repo ten test nie przejdzie — do rozstrzygnięcia:
      # dedykowane konto testowe Google czy świadome pominięcie.
      - name: Instalacja Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start lokalnego stacku Supabase (migracje aplikują się automatycznie)
        run: supabase start

      - name: Eksport zmiennych środowiskowych lokalnego stacku
        run: |
          supabase status -o json > /tmp/supabase-status.json
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(node -pe 'require("/tmp/supabase-status.json").API_URL')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(node -pe 'require("/tmp/supabase-status.json").ANON_KEY')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(node -pe 'require("/tmp/supabase-status.json").SERVICE_ROLE_KEY')"
            echo "DATABASE_URL=$(node -pe 'require("/tmp/supabase-status.json").DB_URL')"
            echo "DIRECT_URL=$(node -pe 'require("/tmp/supabase-status.json").DB_URL')"
          } >> "$GITHUB_ENV"

      # PRZENIESIONE tutaj, PO starcie Supabase i eksporcie zmiennych (2026-09-30,
      # diagnoza żywym zapytaniem jako rola anon, PR diagnostyczny #36): Next.js
      # wpieka NEXT_PUBLIC_* w bundel przeglądarki W CZASIE BUILDA, nie w czasie
      # uruchomienia. Playwright serwuje ten build przez `npm run start`
      # (playwright.config.ts, produkcyjny `next start`, nie `next dev`) — build
      # wykonany PRZED startem Supabase miał wpieczony placeholder/nieprawidłowy
      # klucz anon, więc KAŻDE zapytanie przeglądarki do Supabase (katalog,
      # rekomendacje, ceny w modalu urządzenia) failowało cicho przez błąd
      # autoryzacji, niezależnie od tego, czy dane w bazie istniały. Sprawdzone
      # bezpośrednim zapytaniem SQL jako rola `anon` na dokładnie tych samych
      # danych z fuji_seed.sql — zwraca poprawne wyniki, więc problem był
      # wyłącznie w kolejności kroków tego workflow, nie w danych ani w RLS.
      - name: Budowanie projektu (Turborepo)
        run: npm run build

      - name: Instalacja przeglądarek dla Playwright
        run: npx playwright install --with-deps
        working-directory: ./turborepo/apps/b2c-web

      - name: Testy E2E (Playwright)
        run: npx playwright test
        working-directory: ./turborepo/apps/b2c-web

      - name: Zatrzymanie lokalnego stacku Supabase
        if: always()
        run: supabase stop

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: turborepo/apps/b2c-web/playwright-report/
          retention-days: 7