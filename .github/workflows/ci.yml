name: CI / CD Workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v3

      - name: Instalacja Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalacja pakietów
        run: npm install

      - name: Budowanie projektu (Turborepo)
        run: npm run build